<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 'wasm-unsafe-eval' lets the STEP importer (OpenCascade compiled to WebAssembly)
         call WebAssembly.instantiate. It permits wasm compilation only — unlike
         'unsafe-eval', JavaScript eval() and new Function() stay blocked. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: meshpit-thumb:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'"
    />
    <title>MeshPit</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
